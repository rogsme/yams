<script>
  (function () {
    const pageContainer = document.querySelector('.book-page') || document.querySelector('article') || document.body;
    if (!pageContainer) return;

    const PLACEHOLDERS = [
      { pattern: '[[install_path]]', key: 'install_path', storage: 'install_path', fallback: '/opt/yams' },
      { pattern: '[[media_path]]', key: 'media_path', storage: 'MEDIA_PATH', fallback: '/srv/media' },
      { pattern: '[[user_ip]]', key: 'user_ip', storage: 'USER_IP', fallback: 'YOUR_IP' },
    ];

    const phMap = {};
    for (const ph of PLACEHOLDERS) {
      phMap[ph.pattern] = ph;
    }

    function getConfiguredValue(ph) {
      const stored = localStorage.getItem(ph.storage);
      return stored || ph.fallback;
    }

    function isCustomized(ph) {
      const stored = localStorage.getItem(ph.storage);
      return stored !== null && stored !== '';
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function restoreSpans() {
      const spans = pageContainer.querySelectorAll('.ph');
      for (const span of spans) {
        const key = span.dataset.ph;
        const text = document.createTextNode(`[[${key}]]`);
        span.parentNode.replaceChild(text, span);
      }
    }

    function collectTextNodes() {
      const walker = document.createTreeWalker(pageContainer, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent) return NodeFilter.FILTER_REJECT;
          if (parent.closest('script,style,noscript')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        nodes.push(node);
      }
      return nodes;
    }

    function buildSegments(nodes) {
      const segments = [];
      let offset = 0;

      for (const node of nodes) {
        const text = node.nodeValue || '';
        const start = offset;
        const end = start + text.length;
        segments.push({ node, start, end });
        offset = end;
      }

      return segments;
    }

    function locateOffset(segments, index) {
      let low = 0;
      let high = segments.length - 1;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        const segment = segments[mid];
        if (index < segment.start) {
          high = mid - 1;
        } else if (index >= segment.end) {
          low = mid + 1;
        } else {
          return { node: segment.node, offset: index - segment.start };
        }
      }

      return null;
    }

    function replaceMatches() {
      const textNodes = collectTextNodes();
      if (textNodes.length === 0) return;

      const segments = buildSegments(textNodes);
      const fullText = textNodes.map(node => node.nodeValue || '').join('');
      const matches = [];
      const pattern = new RegExp(PLACEHOLDERS.map(ph => escapeRegExp(ph.pattern)).join('|'), 'g');

      let match;
      while ((match = pattern.exec(fullText)) !== null) {
        const ph = phMap[match[0]];
        if (ph) {
          matches.push({ start: match.index, end: match.index + match[0].length, placeholder: ph });
        }
      }

      for (const item of matches.reverse()) {
        const start = locateOffset(segments, item.start);
        const end = locateOffset(segments, item.end - 1);
        if (!start || !end) continue;

        const range = document.createRange();
        range.setStart(start.node, start.offset);
        range.setEnd(end.node, end.offset + 1);

        const span = document.createElement('span');
        span.className = 'ph';
        span.dataset.ph = item.placeholder.key;
        span.textContent = getConfiguredValue(item.placeholder);

        range.deleteContents();
        range.insertNode(span);
      }
    }

    function walkAndProcess() {
      restoreSpans();
      replaceMatches();
    }

    window.updatePagePaths = walkAndProcess;

    window.addEventListener('storage', function (e) {
      if (e.key === 'install_path' || e.key === 'MEDIA_PATH' || e.key === 'USER_IP') {
        walkAndProcess();
      }
    });

    walkAndProcess();
  })();
</script>
