<script>
  (function () {
    const pageContainer = document.querySelector('.book-page') || document.querySelector('article') || document.body;
    if (!pageContainer) return;

    const PLACEHOLDERS = [
      { pattern: '[[config_path]]', key: 'config_path', storage: 'CONFIG_PATH', fallback: '/opt/yams' },
      { pattern: '[[media_path]]', key: 'media_path', storage: 'MEDIA_PATH', fallback: '/srv/media' },
      { pattern: '[[user_ip]]', key: 'user_ip', storage: 'USER_IP', fallback: 'YOUR_IP' },
    ];

    const phMap = {};
    for (const ph of PLACEHOLDERS) {
      phMap[ph.pattern] = ph;
    }

    function getConfiguredValue(ph) {
      const stored = localStorage.getItem(ph.storage);
      return stored || ph.fallback;
    }

    function isCustomized(ph) {
      const stored = localStorage.getItem(ph.storage);
      return stored !== null && stored !== '';
    }

    function restoreSpans() {
      const spans = pageContainer.querySelectorAll('.ph');
      for (const span of spans) {
        const key = span.dataset.ph;
        const text = document.createTextNode(`[[${key}]]`);
        span.parentNode.replaceChild(text, span);
      }
    }

    function processNode(node, originalText) {
      const joined = PLACEHOLDERS.map(ph => ph.pattern).join('|');
      const escaped = joined.replace(/\[/g, '\\[').replace(/\]/g, '\\]');
      const re = new RegExp(`(${escaped})`, 'g');
      const parts = originalText.split(re);
      if (parts.length === 1) return;

      const fragment = document.createDocumentFragment();
      for (const part of parts) {
        const ph = phMap[part];
        if (ph) {
          const span = document.createElement('span');
          span.className = 'ph';
          span.dataset.ph = ph.key;
          span.textContent = getConfiguredValue(ph);
          fragment.appendChild(span);
        } else {
          fragment.appendChild(document.createTextNode(part));
        }
      }
      node.parentNode.replaceChild(fragment, node);
    }

    function walkAndProcess() {
      restoreSpans();

      const walker = document.createTreeWalker(pageContainer, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      let node;
      while (node = walker.nextNode()) {
        const text = node.nodeValue;
        if (text.includes('[[config_path]]') || text.includes('[[media_path]]') || text.includes('[[user_ip]]')) {
          nodes.push(node);
        }
      }
      for (const n of nodes) {
        processNode(n, n.nodeValue);
      }
    }

    window.updatePagePaths = walkAndProcess;

    window.addEventListener('storage', function (e) {
      if (e.key === 'CONFIG_PATH' || e.key === 'MEDIA_PATH' || e.key === 'USER_IP') {
        walkAndProcess();
      }
    });

    walkAndProcess();
  })();
</script>
