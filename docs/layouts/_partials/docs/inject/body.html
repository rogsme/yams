<script>
  (function () {
    const registry = window.YamsPlaceholders;
    const pageContainer = document.querySelector('.book-page') || document.querySelector('article') || document.body;
    if (!registry || !pageContainer) return;

    const patternSource = registry.values.map(item => escapeRegExp(item.token)).join('|');
    const attributeTemplates = new WeakMap();

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function makePattern() { return new RegExp(patternSource, 'g'); }
    function replaceValue(value) {
      return value.replace(makePattern(), match => registry.get(registry.byToken[match].key));
    }

    function restoreSpans() {
      for (const span of pageContainer.querySelectorAll('.ph[data-ph]')) {
        span.replaceWith(document.createTextNode(registry.tokenFor(span.dataset.ph)));
      }
    }

    function replaceAttributes() {
      for (const element of pageContainer.querySelectorAll('*')) {
        for (const attribute of [...element.attributes]) {
          let templates = attributeTemplates.get(element);
          if (templates?.has(attribute.name)) {
            element.setAttribute(attribute.name, replaceValue(templates.get(attribute.name)));
            continue;
          }
          if (attribute.name.startsWith('data-placeholder-') || !attribute.value.match(makePattern())) continue;
          if (!templates) {
            templates = new Map();
            attributeTemplates.set(element, templates);
          }
          if (!templates.has(attribute.name)) templates.set(attribute.name, attribute.value);
          element.setAttribute(attribute.name, replaceValue(templates.get(attribute.name)));
        }
      }
    }

    function createPlaceholderSpan(definition) {
      const span = document.createElement('span');
      span.className = 'ph';
      span.dataset.ph = definition.key;
      span.textContent = registry.get(definition.key);
      span.title = 'Uses your configured value';
      return span;
    }

    // Markdown interprets _INSTALL_PATH_ as emphasis and removes the outer
    // underscores. Restore that source token before normal replacement.
    function replaceMarkdownTokens() {
      for (const element of pageContainer.querySelectorAll('em')) {
        const definition = registry.byBareToken[element.textContent];
        if (definition) element.replaceWith(createPlaceholderSpan(definition));
      }
    }

    function textNodes(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent || parent.closest('script,style,noscript,.ph')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        },
      });
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) nodes.push(node);
      return nodes;
    }

    function replaceTextNode(node) {
      const text = node.nodeValue || '';
      const pattern = makePattern();
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        if (match.index > lastIndex) fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        fragment.appendChild(createPlaceholderSpan(registry.byToken[match[0]]));
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex === 0) return;
      if (lastIndex < text.length) fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.replaceWith(fragment);
    }

    function locate(segments, index) {
      const segment = segments.find(item => index >= item.start && index < item.end);
      return segment ? { node: segment.node, offset: index - segment.start } : null;
    }

    // Syntax highlighting can split a placeholder across token spans. Process
    // each code block as one text stream, but never join unrelated elements.
    function replaceCodeBlockPlaceholders() {
      for (const block of pageContainer.querySelectorAll('pre, .highlight')) {
        const nodes = textNodes(block);
        const segments = [];
        let offset = 0;
        for (const node of nodes) {
          const end = offset + node.nodeValue.length;
          segments.push({ node, start: offset, end });
          offset = end;
        }
        const matches = [...nodes.map(node => node.nodeValue).join('').matchAll(makePattern())];
        for (const match of matches.reverse()) {
          const start = locate(segments, match.index);
          const end = locate(segments, match.index + match[0].length - 1);
          if (!start || !end) continue;
          const range = document.createRange();
          range.setStart(start.node, start.offset);
          range.setEnd(end.node, end.offset + 1);
          range.deleteContents();
          range.insertNode(createPlaceholderSpan(registry.byToken[match[0]]));
        }
      }
    }

    function replaceRegularText() {
      for (const node of textNodes(pageContainer)) replaceTextNode(node);
    }

    function walkAndProcess() {
      restoreSpans();
      replaceMarkdownTokens();
      replaceAttributes();
      replaceCodeBlockPlaceholders();
      replaceRegularText();
    }

    window.updatePagePaths = walkAndProcess;
    window.addEventListener('storage', event => {
      if (registry.values.some(definition => [definition.storage, definition.legacyStorage].includes(event.key))) {
        walkAndProcess();
      }
    });
    walkAndProcess();
  })();
</script>
