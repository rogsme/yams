<button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
  <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
  </svg>
  <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <span class="theme-toggle-label">Dark theme</span>
</button>

<script>
  (function () {
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;

    function setTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      toggle.setAttribute('aria-pressed', String(isDark));
    }

    setTheme(document.documentElement.dataset.theme || 'light');
    toggle.addEventListener('click', function () {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      if (window.YamsPlaceholders) {
        window.YamsPlaceholders.set('yams-theme', nextTheme);
      }
      setTheme(nextTheme);
    });
  })();
</script>
