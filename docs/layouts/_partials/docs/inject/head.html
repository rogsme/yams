<script>
  (function () {
    const definitions = {
      install_path: { token: '_INSTALL_PATH_', storage: 'yams.install_path', legacyStorage: 'install_path', fallback: '/opt/yams' },
      media_path: { token: '_MEDIA_PATH_', storage: 'yams.media_path', legacyStorage: 'MEDIA_PATH', fallback: '/srv/media' },
      user_ip: { token: '_USER_IP_', storage: 'yams.user_ip', legacyStorage: 'USER_IP', fallback: 'YOUR_IP' },
    };
    const values = Object.entries(definitions).map(([key, definition]) => ({ key, ...definition }));
    const byToken = Object.fromEntries(values.map(definition => [definition.token, definition]));
    const byBareToken = Object.fromEntries(values.map(definition => [definition.token.slice(1, -1), definition]));

    function storageGet(key) {
      try { return window.localStorage.getItem(key); } catch (error) { return null; }
    }

    function storageSet(key, value) {
      try { window.localStorage.setItem(key, value); } catch (error) { /* Storage is optional. */ }
    }

    const themeStorageKey = 'yams.theme';
    const validThemes = ['light', 'dark', 'auto'];
    const configuredTheme = document.documentElement.dataset.theme || 'auto';
    const storedTheme = storageGet(themeStorageKey) || storageGet('yams-theme');
    const theme = validThemes.includes(storedTheme) ? storedTheme : configuredTheme;

    window.YamsTheme = {
      get() { return document.documentElement.dataset.theme; },
      set(nextTheme) {
        if (!validThemes.includes(nextTheme)) return;
        document.documentElement.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = nextTheme === 'auto' ? 'light dark' : nextTheme;
        storageSet(themeStorageKey, nextTheme);
      },
    };

    document.documentElement.dataset.theme = validThemes.includes(theme) ? theme : 'auto';
    document.documentElement.style.colorScheme = theme === 'auto' ? 'light dark' : theme;

    function getStoredValue(definition) {
      const stored = storageGet(definition.storage);
      if (stored !== null) return stored;

      const legacy = definition.legacyStorage ? storageGet(definition.legacyStorage) : null;
      if (legacy !== null) storageSet(definition.storage, legacy);
      return legacy;
    }

    window.YamsPlaceholders = {
      definitions,
      byToken,
      byBareToken,
      values,
      get(key) {
        const definition = definitions[key];
        return definition ? (getStoredValue(definition) || definition.fallback) : '';
      },
      getStored(key) {
        const definition = definitions[key];
        return definition ? getStoredValue(definition) : storageGet(key);
      },
      set(key, value) { storageSet(definitions[key]?.storage || key, value); },
      tokenFor(key) {
        return definitions[key] ? definitions[key].token : '';
      },
    };

  })();
</script>
