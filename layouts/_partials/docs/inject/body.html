<script>
  (function () {
    const pageContainer = document.querySelector('.book-page') || document.querySelector('article') || document.body;
    if (!pageContainer) return;

    const DEFAULTS = {
      '{media_path}': '/srv/media',
      '{config_path}': '/opt/yams'
    };

    let textNodes = [];
    let initialized = false;

    function init() {
      const walker = document.createTreeWalker(pageContainer, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while (node = walker.nextNode()) {
        const originalText = node.nodeValue;
        if (originalText.includes('{media_path}') || originalText.includes('{config_path}')) {
          textNodes.push({ node, originalText });
        }
      }
      initialized = true;
    }

    window.updatePagePaths = function () {
      if (!initialized) init();

      const mediaPath = localStorage.getItem("MEDIA_PATH") || DEFAULTS['{media_path}'];
      const configPath = localStorage.getItem("CONFIG_PATH") || DEFAULTS['{config_path}'];

      for (const { node, originalText } of textNodes) {
        node.nodeValue = originalText
          .replace(/{media_path}/g, mediaPath)
          .replace(/{config_path}/g, configPath);
      }
    };

    window.updatePagePaths();
  })();
</script>
