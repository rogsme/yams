name: Tests

on:
  push:
    branches:
      - master
    paths:
      - src/**
      - tests/**
      - .gitea/workflows/test.yaml
  pull_request:
    paths:
      - src/**
      - tests/**
      - .gitea/workflows/test.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests in Docker
        run: tests/run
